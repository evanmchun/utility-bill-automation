name: Water usage monitor

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-usage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Water Bill

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Water Bill/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: Water Bill/.water-usage-alert-state.json
          key: water-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            water-alert-state-

      - name: Check water usage
        env:
          CLEVELANDWATER_USERNAME: ${{ secrets.CLEVELANDWATER_USERNAME }}
          CLEVELANDWATER_PASSWORD: ${{ secrets.CLEVELANDWATER_PASSWORD }}
          WATER_ALERTS_ENABLED: 'true'
          WATER_ALERT_REPEAT_EVERY_RUN: 'true'
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATER_ALERT_DAILY_LIMIT_GALLONS: '200'
          WATER_ALERT_HOURLY_LIMIT_GALLONS: '150'
          WATER_ALERT_INCREMENT_GALLONS: '100'
          WATER_ALERT_BASELINE_DAYS: '14'
          WATER_ALERT_STATE_FILE: .water-usage-alert-state.json
          HEADLESS: 'true'
        run: node ./download-water-usage.mjs --days 30 --hourly-days 3 --html ./water-usage-report.html --summary "${GITHUB_STEP_SUMMARY}"

      - name: Save alert history
        if: always() && hashFiles('Water Bill/.water-usage-alert-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: Water Bill/.water-usage-alert-state.json
          key: water-alert-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload private HTML report
        if: always() && hashFiles('Water Bill/water-usage-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: water-usage-report-${{ github.run_id }}
          path: Water Bill/water-usage-report.html
          retention-days: 14
          if-no-files-found: error
